name: Security Pipeline (Gitleaks + DAST)

# Ce workflow complète — sans dupliquer — les portes déjà en place :
#   - SCA (dépendances vulnérables)      -> déjà couvert par Dependabot
#   - SAST (analyse statique du code)    -> déjà couvert par CodeQL
#   - Build & Test, scan de conteneur    -> déjà couverts par ci.yml (Maven/npm + Trivy)
# Les deux portes ci-dessous n'avaient aucun équivalent dans le pipeline existant.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------
  # Porte 1 — Détection de secrets (Gitleaks)
  # Scanne l'HISTORIQUE GIT COMPLET, pas seulement le diff du commit —
  # un secret commité puis "supprimé" reste visible dans l'historique.
  # ---------------------------------------------------------------------
  secret-scan:
    name: Gitleaks — Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet requis, pas un checkout superficiel

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Échec automatique du job (et donc blocage du merge) si un secret est détecté —
        # comportement par défaut de l'action, aucune configuration supplémentaire requise.

  # ---------------------------------------------------------------------
  # Porte 2 — DAST (OWASP ZAP Baseline Scan)
  # Attaque l'application EN COURS D'EXÉCUTION, contrairement à CodeQL/Dependabot
  # qui n'analysent que le code source ou les dépendances déclarées.
  # ---------------------------------------------------------------------
  dast-scan:
    name: OWASP ZAP — Dynamic Scan
    runs-on: ubuntu-latest
    needs: secret-scan
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: color_game_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build backend jar
        run: ./mvnw clean package -DskipTests

      - name: Start backend in background
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/color_game_db
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          APP_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
        run: |
          java -jar target/*.jar &
          # Attend que /actuator/health (ou une route publique) réponde avant de lancer le scan
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/auth/login -o /dev/null && break
            sleep 2
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          # baseline = passif, ne modifie/casse pas les données ; suffisant en CI.
          # Une attaque active (action-full-scan) est possible ponctuellement en local,
          # mais trop lente/instable pour tourner sur chaque commit.
          cmd_options: '-a'
          fail_action: true   # bloque le pipeline si un finding High/Critical est trouvé

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
